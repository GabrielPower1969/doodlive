<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FBF5E6">
<title>DoodLive</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="gl"></canvas>
<svg id="guide" class="hidden"><polygon id="guideQuad"/><g id="corners"></g></svg>
<div id="flash"></div>

<section id="start" class="panel">
  <button id="langStart" class="lang" data-lang-toggle>EN</button>
  <h1>DoodLive</h1>
  <p class="sub" data-i18n="tagline">给天使涂上颜色，用手机一扫——她会活过来</p>
  <button id="btnScan" class="primary" data-i18n="scan">开始扫描涂色纸</button>
  <button id="btnDemo" data-i18n="demo">没有纸？看演示</button>
  <a id="lnkPrint" href="print.html" data-i18n="print">打印涂色纸</a>
  <a href="battle.html" data-i18n="battle">⚔️ 大卫 vs 歌利亚（战斗剧场）</a>
</section>

<div id="hud" class="hidden">
  <div id="status"></div>
  <div id="sub"></div>
  <div id="build" title="build fingerprint"></div>
  <div id="help" class="card">
    <h2 data-i18n="helpTitle">帮我找到你的画</h2>
    <ol><li data-i18n="help1">把手机抬高一点，让整张纸都在画面里</li><li data-i18n="help2">对着亮一点的地方，别背光</li><li data-i18n="help3">四个黑方块都要看得见，不要被手挡住</li></ol>
    <button id="helpDemo" data-i18n="helpDemo">先看演示</button>
  </div>
  <div class="bar">
    <button id="btnShoot" class="shutter" aria-label="capture" data-i18n-aria="shoot"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 16.5c0-2 1.6-3.5 3.5-3.5h5l3-4.5h9l3 4.5h5c2 0 3.5 1.5 3.5 3.5v19c0 2-1.5 3.5-3.5 3.5h-25C9.6 39 8 37.5 8 35.5z" fill="var(--c-paper)" stroke="var(--c-ink)" stroke-width="3.5" stroke-linejoin="round"/><circle cx="24" cy="26" r="7.5" fill="var(--c-sky)" stroke="var(--c-ink)" stroke-width="3.5"/></svg></button>
  </div>
  <!-- Live (screen 06): the angel is the button; only two chips stay on screen -->
  <div id="hint" class="hidden" aria-hidden="true"><div class="ring"></div><svg class="hand" viewBox="0 0 48 56"><path d="M18 30V8a4 4 0 018 0v16l10 2.5c3 .8 5 3.6 4.6 6.7L39 46c-.4 3-3 5-6 5H22c-2.3 0-4.4-1.2-5.6-3.2L9 36c-1.3-2.2-.4-5 2-6 1.9-.8 4.1-.2 5.3 1.4z" fill="var(--c-paper)" stroke="var(--c-ink)" stroke-width="3" stroke-linejoin="round"/></svg><span data-i18n="tapHer">点点我！</span></div>
  <button id="btnNew" class="chip hidden" aria-label="new sheet" data-i18n-aria="newSheet"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M10 5h14l7 7v23H10z" fill="var(--c-paper)" stroke="var(--c-ink)" stroke-width="3" stroke-linejoin="round"/><path d="M24 5v7h7" fill="none" stroke="var(--c-ink)" stroke-width="3" stroke-linejoin="round"/><path d="M20.5 18v11M15 23.5h11" stroke="var(--c-red)" stroke-width="3.5" stroke-linecap="round"/></svg></button>
  <button id="btnGate" class="chip hidden" aria-label="grown-ups" data-i18n-aria="holdGate"><svg class="gate-ring" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29"/></svg><svg viewBox="0 0 28 28" aria-hidden="true"><rect x="6" y="12" width="16" height="12" rx="3" fill="none" stroke="var(--c-ink)" stroke-width="3"/><path d="M9.5 12V9a4.5 4.5 0 019 0v3" fill="none" stroke="var(--c-ink)" stroke-width="3" stroke-linecap="round"/></svg></button>
  <div id="more" class="drawer">
    <h3 data-i18n="grownups">大人专区</h3>
    <div class="row"><span data-i18n="language">界面语言</span><button id="langHud" class="seg lang-seg" data-lang-seg><span data-l="zh">中文</span><span data-l="en">EN</span></button></div>
    <button id="btnTitle" class="hidden seg" aria-label="pinyin / ABC"><span class="on" data-i18n="pinyin">拼音</span><span data-i18n="abc">ABC</span></button>
    <button id="btnLines" class="hidden">线条：隐藏</button>
    <button id="btnMode" class="hidden">展示模式</button>
    <button id="btnXR" class="hidden primary" data-i18n="xr">放到桌上（AR）</button>
    <button id="btnExitXR" class="hidden" data-i18n="exitXR">退出 AR</button>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
