<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FBF5E6">
<title>DoodLive</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="gl"></canvas>
<svg id="guide" class="hidden"><path id="guideQuad"/><g id="corners"></g></svg>
<div id="flash"></div>

<section id="start" class="panel">
  <div class="doodles" aria-hidden="true"><i class="d1"></i><i class="d2"></i><i class="d3"></i><i class="d4"></i><i class="d5"></i><i class="d6"></i></div>
  <h1 class="logo" aria-label="DoodLive"><span>D</span><span>o</span><span>o</span><span>d</span><span>L</span><span>i</span><span>v</span><span>e</span></h1>
  <p class="sub" data-i18n="tagline">给天使涂上颜色，用手机一扫——她会活过来</p>
  <div class="stage" aria-hidden="true">
    <img class="sheet" src="assets/lineart-small.webp" alt=""><i class="tape t1"></i><i class="tape t2"></i>
    <img class="climber" src="assets/angel-cutout.webp" alt="">
  </div>
  <button id="btnScan" class="shutter big" aria-label="scan" data-i18n-aria="scanLong"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 16.5c0-2 1.6-3.5 3.5-3.5h5l3-4.5h9l3 4.5h5c2 0 3.5 1.5 3.5 3.5v19c0 2-1.5 3.5-3.5 3.5h-25C9.6 39 8 37.5 8 35.5z" fill="var(--c-paper)" stroke="var(--c-ink)" stroke-width="3.5" stroke-linejoin="round"/><circle cx="24" cy="26" r="7.5" fill="var(--c-sky)" stroke="var(--c-ink)" stroke-width="3.5"/><path d="M36 8l1.2 2.6L40 12l-2.8 1.3L36 16l-1.2-2.7L32 12l2.8-1.4z" fill="var(--c-red)"/></svg></button>
  <div class="scan-label"><b data-i18n="scan">扫一扫</b><small data-i18n="scanLong">开始扫描涂色纸</small></div>
  <button id="btnDemo" class="tag" data-i18n="demo">没有纸？看演示</button>
</section>

<div id="ui">
<div id="hud" class="hidden">
  <div id="status"></div>
  <div id="sub"></div>
  <div id="build" title="build fingerprint"></div>
  <div id="coach" class="hidden" aria-hidden="true"><svg viewBox="0 0 120 150"><rect x="30" y="12" width="60" height="100" rx="12" fill="var(--c-paper)" stroke="var(--c-ink)" stroke-width="4"/><circle cx="60" cy="30" r="5" fill="var(--c-sky)"/><path d="M8 60c-6 20 0 40 14 52M112 60c6 20 0 40-14 52" stroke="var(--c-sun)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9" fill="none"/><path d="M60 122v20M52 134l8 8 8-8" stroke="var(--c-sun)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></div>
  <div id="stamp" aria-hidden="true"><svg viewBox="0 0 60 60"><path d="M12 31l12 12 24-26" stroke="var(--c-paper)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></div>
  <div id="help" class="card">
    <img class="peek" src="assets/angel-cutout.webp" alt="">
    <div class="thought">
      <figure><svg viewBox="0 0 56 56"><rect x="18" y="16" width="20" height="34" rx="5" stroke="var(--c-ink)" stroke-width="3.5" fill="var(--c-paper)"/><path d="M28 4v8M22 9l6-6 6 6" stroke="var(--c-red)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><figcaption data-i18n="helpLift">抬高一点</figcaption></figure>
      <figure><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="10" fill="var(--c-sun)" stroke="var(--c-ink)" stroke-width="3.5"/><path d="M28 6v6M28 44v6M6 28h6M44 28h6M12 12l4 4M40 40l4 4M44 12l-4 4M16 40l-4 4" stroke="var(--c-orange)" stroke-width="3.5" stroke-linecap="round"/></svg><figcaption data-i18n="helpLight">对着亮处</figcaption></figure>
      <figure><svg viewBox="0 0 56 56"><rect x="10" y="8" width="36" height="42" rx="3" stroke="var(--c-ink)" stroke-width="3" fill="var(--c-paper)"/><rect x="13" y="11" width="7" height="7" fill="var(--c-ink)"/><rect x="36" y="11" width="7" height="7" fill="var(--c-ink)"/><rect x="13" y="40" width="7" height="7" fill="var(--c-ink)"/><rect x="36" y="40" width="7" height="7" fill="var(--c-ink)"/></svg><figcaption data-i18n="helpSquares">四个方块</figcaption></figure>
    </div>
    <h2 data-i18n="helpTitle">帮我找到你的画</h2>
    <button id="helpDemo" class="tag" data-i18n="helpDemo">先看演示</button>
  </div>
  <div id="lostCard" aria-hidden="true"><svg viewBox="0 0 160 200"><rect x="30" y="60" width="100" height="124" rx="6" stroke="var(--c-paper)" stroke-width="4" stroke-dasharray="3 10" stroke-linecap="round" fill="none"/><rect x="38" y="68" width="10" height="10" fill="var(--c-paper)"/><rect x="112" y="68" width="10" height="10" fill="var(--c-paper)"/><rect x="38" y="166" width="10" height="10" fill="var(--c-paper)"/><rect x="112" y="166" width="10" height="10" fill="var(--c-paper)"/><path class="arrow" d="M80 6v38M66 30l14 14 14-14" stroke="var(--c-sun)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></div>
  <div id="burst" aria-hidden="true"></div>
  <div class="bar">
    <button id="btnShoot" class="shutter" aria-label="capture" data-i18n-aria="shoot"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 16.5c0-2 1.6-3.5 3.5-3.5h5l3-4.5h9l3 4.5h5c2 0 3.5 1.5 3.5 3.5v19c0 2-1.5 3.5-3.5 3.5h-25C9.6 39 8 37.5 8 35.5z" fill="var(--c-paper)" stroke="var(--c-ink)" stroke-width="3.5" stroke-linejoin="round"/><circle cx="24" cy="26" r="7.5" fill="var(--c-sky)" stroke="var(--c-ink)" stroke-width="3.5"/></svg></button>
  </div>
  <!-- Live (screen 06): the angel is the button; only two chips stay on screen -->
  <div id="hint" class="hidden" aria-hidden="true"><div class="ring"></div><svg class="hand" viewBox="0 0 48 56"><path d="M18 30V8a4 4 0 018 0v16l10 2.5c3 .8 5 3.6 4.6 6.7L39 46c-.4 3-3 5-6 5H22c-2.3 0-4.4-1.2-5.6-3.2L9 36c-1.3-2.2-.4-5 2-6 1.9-.8 4.1-.2 5.3 1.4z" fill="var(--c-paper)" stroke="var(--c-ink)" stroke-width="3" stroke-linejoin="round"/></svg><span data-i18n="tapHer">点点我！</span></div>
  <button id="btnNew" class="chip hidden" aria-label="new sheet" data-i18n-aria="newSheet"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M10 5h14l7 7v23H10z" fill="var(--c-paper)" stroke="var(--c-ink)" stroke-width="3" stroke-linejoin="round"/><path d="M24 5v7h7" fill="none" stroke="var(--c-ink)" stroke-width="3" stroke-linejoin="round"/><path d="M20.5 18v11M15 23.5h11" stroke="var(--c-red)" stroke-width="3.5" stroke-linecap="round"/></svg></button>
</div>
<button id="btnGate" class="chip hidden" aria-label="grown-ups" data-i18n-aria="holdGate"><svg class="gate-ring" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29"/></svg><svg viewBox="0 0 28 28" aria-hidden="true"><rect x="6" y="12" width="16" height="12" rx="3" fill="none" stroke="var(--c-ink)" stroke-width="3"/><path d="M9.5 12V9a4.5 4.5 0 019 0v3" fill="none" stroke="var(--c-ink)" stroke-width="3" stroke-linecap="round"/></svg></button>
<div id="more" class="drawer" role="dialog" aria-labelledby="moreTitle">
  <h3 id="moreTitle" data-i18n="grownups">大人专区</h3>
  <div class="row"><span data-i18n="language">界面语言</span><button id="langHud" class="seg"><span data-l="zh">中文</span><span data-l="en">EN</span></button></div>
  <div class="row"><span data-i18n="wordCard">学习卡</span><button id="btnTitle" class="seg" aria-label="pinyin / ABC"><span class="on" data-i18n="pinyin">拼音</span><span data-i18n="abc">ABC</span></button></div>
  <div class="row"><span data-i18n="sound">声音</span><button id="tglSound" class="toggle on" role="switch" aria-checked="true"><i></i></button></div>
  <div class="row"><span data-i18n="haptics">震动</span><button id="tglHaptics" class="toggle on" role="switch" aria-checked="true"><i></i></button></div>
  <div class="row"><span data-i18n="music">音乐音量</span><input id="rngMusic" type="range" min="0" max="50" value="22"></div>
  <div class="extra">
    <button id="btnLines" class="hidden">线条：隐藏</button>
    <button id="btnMode" class="hidden">展示模式</button>
    <button id="btnXR" class="hidden primary" data-i18n="xr">放到桌上（AR）</button>
    <button id="btnExitXR" class="hidden" data-i18n="exitXR">退出 AR</button>
    <a id="lnkPrint" href="print.html" data-i18n="print">打印涂色纸</a>
    <a href="battle.html" data-i18n="battle">⚔️ 大卫 vs 歌利亚（战斗剧场）</a>
  </div>
  <button id="btnDone" class="primary" data-i18n="done">好了</button>
</div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
